[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gozar"
version = "2.1.4"
description = "Find, test and keep a working pool of free public proxy configs, then connect through the best of them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["proxy", "vless", "hysteria2", "shadowsocks", "sing-box", "connectivity", "network"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Networking",
]
dependencies = [
  "aiohttp>=3.9",
  "aiohttp-socks>=0.8",
]

[project.optional-dependencies]
# `pip install "gozar[engine]"` pulls a wheel that bundles the official sing-box
# binaries. Optional on purpose: it is ~130MB, and a machine that already has
# sing-box on PATH should not pay for it.
engine = ["sing-box-bin>=1.10"]
dev = ["setuptools>=68", "build", "twine"]

# Console script: a real, hand-written FILE (scripts/gozar) rather than a
# setuptools stub. From a 2026-11-28 report: a generated stub's first statement
# is `from gozar.cli import cli`, so on a broken install the user sees a bare
# ModuleNotFoundError from ~/.local/bin/gozar and cannot tell which of four
# causes it is. scripts/gozar wraps that import and explains it.
#
# pip only rewrites the shebang of a file it ships as `scripts/`, so the file is
# shipped in the wheel's script directory (see MANIFEST.in + scripts/gozar).
# NO [project.scripts] on purpose — see below.
[tool.setuptools]
packages = ["gozar"]
script-files = ["scripts/gozar"]

[project.urls]
Homepage = "https://github.com/amirreaper/gozar"
Repository = "https://github.com/amirreaper/gozar"

[tool.setuptools.package-data]
gozar = ["py.typed"]

